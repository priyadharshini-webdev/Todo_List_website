<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickit – From someday to done.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
 
  <!-- decorative sparkles -->
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle" style="--size: 22px; top: 26%; left: 30%; --delay: 0s;   --time: 3.2s;"></span>
    <span class="sparkle gold" style="--size: 16px; top: 20%; right: 28%; --delay: 1s;   --time: 2.8s;"></span>
    <span class="sparkle" style="--size: 14px; top: 62%; left: 22%; --delay: 1.8s; --time: 3.6s;"></span>
    <span class="sparkle gold" style="--size: 20px; top: 68%; right: 24%; --delay: 0.6s; --time: 3s;"></span>
  </div>

  <main class="hero container d-flex flex-column align-items-center justify-content-center text-center">

    <!-- 3D mascot (the canvas is added by script.js) -->
    <div id="mascot" class="mascot" aria-label="Tickit mascot"></div>

    <!-- Wordmark + leaf -->
    <h1 class="wordmark">
      Tickit
      <svg class="leaf" viewBox="0 0 40 60" aria-hidden="true">
        <path d="M20 58C20 40 20 30 20 22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M20 26C4 24 2 8 4 2c14 0 20 10 16 24z" fill="currentColor"/>
        <path d="M20 34c10-1 16-8 16-16-10 0-17 6-16 16z" fill="currentColor" opacity=".7"/>
      </svg>
    </h1>

    <p class="tagline">From someday to done.</p>

    <a id="get-started" class="btn-neu" href="home.html">Get Started</a>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
