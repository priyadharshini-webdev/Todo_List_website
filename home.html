<!DOCTYPE html>                                   
<html lang="en">                                   
<head>
  <meta charset="UTF-8">                           <!-- show all letters and symbols properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- fit mobile screens -->
  <title>Tickit - Home</title>                     <!-- name shown on the browser tab -->

  <!-- bootstrap and font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  <!-- bootstrap design -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">   <!-- heading font -->

  <!-- my css -->
  <link href="app.css" rel="stylesheet">           <!-- my own design, after bootstrap so mine wins -->
</head>

<body data-page="home">  <!-- tells app.js this is the home page -->
  
  <!-- decorative sparkles -->
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle" style="--size: 22px; top: 15%; left: 30%; --delay: 0s;   --time: 3.2s;"></span> //fix
    <span class="sparkle gold" style="--size: 16px; top: 20%; right: 10%; --delay: 1s;   --time: 2.8s;"></span> //fix
    <span class="sparkle gold" style="--size: 14px; top: 70%; left: 16%; --delay: 1.8s; --time: 3.6s;"></span> //fix
     <span class="sparkle gold" style="--size: 16px; top: 50%; right: 40%; --delay: 1s;   --time: 2.8s;"></span> //fix
    <span class="sparkle" style="--size: 20px; top: 26%; right: 98%; --delay: 0.6s; --time: 3s;"></span> //fix
    <span class="sparkle gold" style="--size: 20px; top: 87%; right: 24%; --delay: 0.6s; --time: 3s;"></span>

  </div>

  <!-- navbar comes from app.js -->
  <div id="nav"></div>                             <!-- empty box, app.js puts the menu here -->

  <main class="container py-5">                    <!-- container = center the content, py-5 = space top and bottom -->
    <div class="row g-4">                          <!-- row = columns in one line, g-4 = gap between them -->

      <!-- left side -->
      <section class="col-lg-8">                   <!-- 8 of 12 width on laptop, full width on mobile -->
        <h2 class="page-title">My Tasks</h2>       <!-- main heading -->
        <p id="summary" class="text-secondary mb-4"></p>   <!-- app.js writes "2 pending, 1 completed" here -->

        <form id="add-form" class="soft-card p-2 d-flex gap-2 mb-4">   <!-- d-flex = input and button in one line -->
          <input id="task-input" class="form-control" type="text"
                 maxlength="120" placeholder="What do you need to do?" autocomplete="off">   <!-- type the new task here -->
          <button class="btn btn-sage" type="submit">Add</button>   <!-- submit button, app.js adds the task -->
        </form>

        <!-- tasks are added here by app.js -->
        <div id="task-list" class="task-grid one"></div>   <!-- "one" = one task per row -->
      </section>

      <!-- right side -->
      <aside class="col-lg-4">                     <!-- 4 of 12 width on laptop, goes below on mobile -->

        <div class="soft-card p-4 mb-4">           <!-- progress card -->
          <h5 class="mb-3">Today's progress</h5>   <!-- small heading -->
          <div id="percent" class="big-number">0%</div>   <!-- app.js writes the percentage here -->

          <div class="progress my-3">              <!-- grey bar, my-3 = space above and below -->
            <div id="bar" class="progress-bar"></div>   <!-- green part, app.js sets its width -->
          </div>

          <div class="d-flex justify-content-between text-secondary">   <!-- one on the left, one on the right -->
            <span><b id="pending-count">0</b> pending</span>   <!-- app.js writes pending count -->
            <span><b id="done-count">0</b> done</span>         <!-- app.js writes done count -->
          </div>
        </div>

        <div class="soft-card p-4">                <!-- streak card -->
          <h5 class="mb-3">Daily streak</h5>       <!-- small heading -->
          <div id="streak-side" class="big-number">0</div>   <!-- app.js writes the streak number here -->
          <small class="text-secondary">days in a row</small>   <!-- small text under the number -->
          <a href="profile.html" class="btn btn-outline-sage w-100 mt-3">View profile</a>   <!-- w-100 = full width button, goes to profile -->
        </div>

      </aside>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  <!-- bootstrap js, for the mobile menu button -->
  <script src="app.js"></script>                   <!-- my logic, last so the page is loaded first -->
</body>
</html>
