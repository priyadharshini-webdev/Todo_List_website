<!DOCTYPE html>                                    <!-- this is an HTML5 page -->
<html lang="en">                                   <!-- page language is English -->
<head>
  <meta charset="UTF-8">                           <!-- show all letters and symbols properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1">  <!-- fit mobile screens -->
  <title>Tickit - Profile</title>                  <!-- name shown on the browser tab -->

  <!-- bootstrap and font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  <!-- bootstrap design -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">   <!-- heading font -->

  <!-- my css -->
  <link href="app.css" rel="stylesheet">           <!-- my own design, after bootstrap so mine wins -->
</head>

<body data-page="profile">                         <!-- tells app.js this is the profile page -->

<!-- decorative sparkles -->
  <div class="sparkles" aria-hidden="true">
    <span class="sparkle" style="--size: 22px; top: 15%; left: 40%; --delay: 0s;   --time: 3.2s;"></span> 
    <span class="sparkle gold" style="--size: 16px; top: 20%; right: 10%; --delay: 1s;   --time: 2.8s;"></span> 
    <span class="sparkle gold" style="--size: 14px; top: 70%; left: 16%; --delay: 1.8s; --time: 3.6s;"></span> 
    <span class="sparkle" style="--size: 20px; top: 26%; right: 98%; --delay: 0.6s; --time: 3s;"></span> 
    <span class="sparkle gold" style="--size: 20px; top: 87%; right: 24%; --delay: 0.6s; --time: 3s;"></span>

  </div>

  <!-- navbar comes from app.js -->
  <div id="nav"></div>                             <!-- empty box, app.js puts the menu here -->

  <main class="container py-5">                    <!-- container = center the content, py-5 = space top and bottom -->
    <div class="row g-4">                          <!-- row = columns in one line, g-4 = gap between them -->

      <!-- left side -->
      <div class="col-lg-4 d-grid gap-3 align-content-start">  <!-- 4 of 12 width on laptop, cards stacked, start from top -->

        <div class="soft-card p-4 text-center">    <!-- cream card, inside space, text in center -->
          <div class="avatar mx-auto mb-3">&#129418; </div>     <!-- round avatar, mx-auto = center it -->
          <h3 class="mb-1">My Profile</h3>         <!-- heading, small gap below -->
          <p id="streak-msg" class="text-secondary mb-0"></p>   <!-- app.js writes the streak message here -->
        </div>

        <div class="soft-card p-4 stat">           <!-- stat = text on the left, number on the right -->
          <span class="text-secondary">Current streak</span>    <!-- label -->
          <span id="streak-current" class="big-number">0</span> <!-- app.js writes the number here -->
        </div>

        <div class="soft-card p-4 stat">
          <span class="text-secondary">Best streak</span>       <!-- label -->
          <span id="streak-best" class="big-number">0</span>    <!-- app.js writes the best streak here -->
        </div>

        <div class="soft-card p-4 stat">
          <span class="text-secondary">Tasks completed</span>   <!-- label -->
          <span id="total-done" class="big-number">0</span>     <!-- app.js writes total done tasks here -->
        </div>

      </div>

      <!-- right side -->
      <div class="col-lg-8">                       <!-- 8 of 12 width on laptop, full width on mobile -->
        <div class="soft-card p-4 h-100">          <!-- h-100 = same height as the left side -->
          <h5 class="mb-4">Last 28 days</h5>       <!-- small heading -->

          <!-- calendar boxes are added here by app.js -->
          <div id="calendar" class="calendar"></div>  <!-- app.js adds 28 day boxes inside -->
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>  <!-- bootstrap js, for the mobile menu button -->
  <script src="app.js"></script>                   <!-- my logic, last so the page is loaded first -->
</body>
</html>
